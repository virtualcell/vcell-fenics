# §1.6.6 of docs/modeling/declarative-formalism.md.
# Ligand-receptor binding with bulk diffusion and the §1.6.5 composable
# bulk-surface coupling pattern (Neumann BC on bulk + matching source terms
# on the surface variables).
math_description:
  geometry: cell_with_extracellular

  subdomains:
    - name: extracellular
      kind: volume
      motion: { kind: none }
    - name: membrane
      kind: surface
      motion:
        kind: prescribed
        velocity: "0"

  variables:
    - { name: L,     subdomain: extracellular }
    - { name: rho_f, subdomain: membrane }
    - { name: rho_b, subdomain: membrane }

  equations:
    - template: bulk_radv_diff
      variable: L
      subdomain: extracellular
      temporality: time_dependent
      terms:
        diffusion: "0.5"
      initial_condition: "1.0"

    - template: surface_pde_with_dilution
      variable: rho_f
      subdomain: membrane
      temporality: time_dependent
      terms:
        diffusion: "0.05"
        source: "-(k_on * trace(L) * rho_f - k_off * rho_b)"
      initial_condition: "0.5"

    - template: surface_pde_with_dilution
      variable: rho_b
      subdomain: membrane
      temporality: time_dependent
      terms:
        diffusion: "0.05"
        source: "k_on * trace(L) * rho_f - k_off * rho_b"
      initial_condition: "0.0"

  boundary_conditions:
    - kind: dirichlet
      variable: L
      boundary: outer
      expression: "L_reservoir"

    - kind: neumann
      variable: L
      boundary: membrane
      expression: "k_on * trace(L) * rho_f - k_off * rho_b"

  parameters:
    - { name: k_on,        value: 0.10 }
    - { name: k_off,       value: 0.02 }
    - { name: L_reservoir, value: 1.00 }
