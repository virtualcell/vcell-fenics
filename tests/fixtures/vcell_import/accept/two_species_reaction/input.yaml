name: binding
constants:
- name: D
  exp: '0.2'
- name: k_on
  exp: '1.0'
- name: k_off
  exp: '0.2'
compartment_subdomains:
- name: cytosol
  pde_equations:
  - name: A
    rate: -k_on*A + k_off*B
    diffusion: D
    initial: 1.0 + 0.3*x
  - name: B
    rate: k_on*A - k_off*B
    diffusion: D
    initial: '0.0'
