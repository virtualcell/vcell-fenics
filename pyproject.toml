[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcell-fenics"
version = "0.0.0"
description = "FEniCSx-based cell mechanics and migration modeling, in the context of Virtual Cell."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
authors = [{ name = "Jim Schaff" }]

[tool.hatch.build.targets.wheel]
packages = ["src/vcell_fenics"]

# ---------------------------------------------------------------------------
# Pixi configuration
#   docs: https://pixi.sh/latest/
#
#   Source of truth for environments and tasks. After editing dependencies,
#   run `pixi install` to refresh pixi.lock.
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
vcell-fenics = { path = ".", editable = true }
# VCell integration (pyvcell_bridge). pyvcell >= 0.3.0 publishes the pure-Pydantic VCML data
# model (pyvcell.vcml.models_math / models_geometry) with a minimal default dependency set
# (lxml + numexpr on top of pydantic/numpy) — its heavy solver/viz/binary stack is behind
# optional extras we don't request. So it's a normal, lock-reproducible dependency now; no
# --no-deps editable workaround. The remote-client / full-stack scripts still use ../pyvcell/.venv.
pyvcell = ">=0.3.1,<0.4"

[tool.pixi.dependencies]
# Pin Python >= 3.12 across platforms (it is otherwise unconstrained, so platforms
# diverge — osx-arm64 solved to 3.14 while linux-64 picked 3.11). pyvcell >= 0.3.0
# requires >= 3.12, so both platforms must agree.
python = ">=3.12"
# Core FEniCSx stack (conda-forge). Pin DOLFINx to 0.10.x — native
# mixed-dimensional assembly (used by Approach B) landed in this release.
# mpich is the recommended MPI variant on macOS arm64.
fenics-dolfinx = "0.10.*"
mpich = "*"
petsc4py = "*"

# DOLFINx ecosystem add-ons
scifem = "*"                       # point sources, blocked Newton, real fn space
dolfinx_mpc = "*"                  # multi-point constraints (periodic BCs, slip)

# Meshing and I/O
gmsh = "*"
python-gmsh = "*"
meshio = "*"

# Visualization
matplotlib = "*"
pyvista = "*"

# Numerics
numpy = "*"
scipy = "*"
pyyaml = ">=6.0.3,<7"
# Marching (contour extraction) for body-fitted realization of an implicit (Rvachev) field —
# skimage.measure.find_contours in 2D, marching_cubes in 3D (backend/realize.py).
scikit-image = "*"

# pydantic backs pyvcell's VCML data model (the import source); pinned here as a conda
# package so pyvcell's pydantic requirement resolves from conda-forge, not a PyPI wheel.
pydantic = ">=2.10,<3"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ipython = "*"
ruff = "*"
mypy = "*"
types-pyyaml = ">=6.0.12.20260518,<7"
# For running the demo notebooks in docs/notebooks/ (`pixi run -e dev notebooks`).
# ipykernel makes the dev env's Python the notebook kernel.
jupyterlab = "*"
ipykernel = "*"

# Approach D (cut/trace FEM via CutFEMx) is intentionally NOT defined here yet.
# CutFEMx v0.1.0 targets DOLFINx 0.9 (not 0.10) and is source-only; it will
# need its own pixi feature with a separate solve-group when we wire it up.
#
# dolfinx-external-operator (active-stress / nonstandard constitutive models
# via JAX/Numba) is PyPI-only; add as a pypi-dependency under a new feature
# when active-gel mechanics are actually being implemented.

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest -m 'not integration'"
test-integration = "pytest -m integration"
lint = "ruff check src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
typecheck = "mypy src tests"
check = { depends-on = ["lint", "format-check", "typecheck", "test"] }
# Launch JupyterLab on the demo notebooks (needs the dev env: `pixi run -e dev notebooks`).
notebooks = "jupyter lab docs/notebooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rP shows captured stdout for passed tests in the summary, so tests that
# write inspectable artifacts (viz, ParaView output) surface the paths
# without requiring `-s`.
addopts = ["-rP"]
# `integration`: slow verification/convergence tests (minutes), excluded from the default
# `test`/`check` run. Run them with `pixi run -e dev test-integration`.
markers = ["integration: slow verification/convergence test, excluded from the default run"]
filterwarnings = [
    # PETSc on some platforms warns when LU is chosen on a tiny linear problem.
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format. Applies to src/ and tests/ alike.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".pixi", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
# pep8-naming (N) intentionally NOT selected: scientific code uses single-letter
# names like D, c, ρ, V that would otherwise be flagged.
ignore = [
    # Homoglyph rules flag Greek letters (ρ, Γ, ∇, λ, …) as ambiguous Latin
    # look-alikes. They exist to catch homoglyph attacks in identifiers; in
    # scientific docstrings/comments the Greek symbols are intentional and
    # match the math in the literature. Disable across the board.
    "RUF001",  # ambiguous unicode in identifier
    "RUF002",  # ambiguous unicode in docstring
    "RUF003",  # ambiguous unicode in comment
]

[tool.ruff.lint.per-file-ignores]
# Tests can shadow fixtures with the same name as parameters; common pytest pattern.
"tests/**/*.py" = ["B018"]

# ---------------------------------------------------------------------------
# mypy — strict mode. Applies to src/ and tests/ alike.
#
# The FEniCSx scientific stack ships either no stubs or partial/buggy ones
# (e.g. petsc4py.PETSc.ScalarType typed as a non-callable dtype, pyvista
# Plotter methods missing `self`). We treat these libraries as opaque
# (follow_imports = "skip") so their boundaries become Any, and we type our
# own code strictly. We do NOT add a global ignore_missing_imports — that
# would mask real typos in our own modules.
# ---------------------------------------------------------------------------

[tool.mypy]
strict = true
# Match requires-python (>= 3.12) and the runtime (3.14): the env's scientific deps (e.g.
# tifffile via scikit-image) use 3.12+ `type` statements that mypy cannot parse under 3.11.
python_version = "3.12"
files = ["src", "tests"]
# Strict already enables warn_unused_ignores; keep it explicit so anyone
# reading the config sees that `# type: ignore` comments must be load-bearing.
warn_unused_ignores = true
# The FEniCSx stack ships py.typed but leaves many functions unannotated, so
# strict mode's disallow_untyped_calls would flag every grad()/dot()/Measure()
# call. Exclude those packages from *that one* check while keeping every other
# real check against their types. See ADR 005; the whole stack was previously
# follow_imports="skip" (all Any), which also hid genuine type errors in our code.
untyped_calls_exclude = ["ufl", "basix", "dolfinx", "pyvista", "scifem", "dolfinx_mpc", "skimage"]

[[tool.mypy.overrides]]
# These packages either ship no types (gmsh, meshio) or partly-wrong ones;
# ignore_missing_imports lets the untyped ones resolve to Any without a
# "missing stubs" error. We no longer follow_imports="skip" — we use whatever
# real types they provide (ADR 005).
module = [
    "dolfinx.*",
    "ufl.*",
    "basix.*",
    "petsc4py.*",
    "mpi4py.*",
    "gmsh",
    "pyvista",
    "pyvista.*",
    "scifem.*",
    "dolfinx_mpc.*",
    "meshio",
    "scipy.*",
    "skimage",
    "skimage.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyvcell >= 0.3.1 ships py.typed, so we use its real (pydantic) types — the bridge importers
# are annotated with pyvcell's MathDescription / Geometry, not Any. `follow_imports = "silent"`
# is pyvcell's recommended consumer config: use its annotations but don't report errors from
# following into its internal modules that pull optional-extra deps we don't install (libvcell,
# the solver/viz stack). Pure consumer-side; never ships in any wheel.
module = ["pyvcell.*"]
follow_imports = "silent"
