[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcell-fenics"
version = "0.0.0"
description = "FEniCSx-based cell mechanics and migration modeling, in the context of Virtual Cell."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "Jim Schaff" }]

[tool.hatch.build.targets.wheel]
packages = ["src/vcell_fenics"]

# ---------------------------------------------------------------------------
# Pixi configuration
#   docs: https://pixi.sh/latest/
#
#   Source of truth for environments and tasks. After editing dependencies,
#   run `pixi install` to refresh pixi.lock.
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
vcell-fenics = { path = ".", editable = true }

[tool.pixi.dependencies]
# Core FEniCSx stack (conda-forge). Pin DOLFINx to 0.10.x — native
# mixed-dimensional assembly (used by Approach B) landed in this release.
# mpich is the recommended MPI variant on macOS arm64.
fenics-dolfinx = "0.10.*"
mpich = "*"
petsc4py = "*"

# DOLFINx ecosystem add-ons
scifem = "*"                       # point sources, blocked Newton, real fn space
dolfinx_mpc = "*"                  # multi-point constraints (periodic BCs, slip)

# Meshing and I/O
gmsh = "*"
python-gmsh = "*"
meshio = "*"

# Visualization
matplotlib = "*"
pyvista = "*"

# Numerics
numpy = "*"
scipy = "*"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ipython = "*"
ruff = "*"
mypy = "*"

# Approach D (cut/trace FEM via CutFEMx) is intentionally NOT defined here yet.
# CutFEMx v0.1.0 targets DOLFINx 0.9 (not 0.10) and is source-only; it will
# need its own pixi feature with a separate solve-group when we wire it up.
#
# dolfinx-external-operator (active-stress / nonstandard constitutive models
# via JAX/Numba) is PyPI-only; add as a pypi-dependency under a new feature
# when active-gel mechanics are actually being implemented.

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check src tests"
format = "ruff format src tests"
format-check = "ruff format --check src tests"
typecheck = "mypy src tests"
check = { depends-on = ["lint", "format-check", "typecheck", "test"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rP shows captured stdout for passed tests in the summary, so tests that
# write inspectable artifacts (viz, ParaView output) surface the paths
# without requiring `-s`.
addopts = ["-rP"]
filterwarnings = [
    # PETSc on some platforms warns when LU is chosen on a tiny linear problem.
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format. Applies to src/ and tests/ alike.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".pixi", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
# pep8-naming (N) intentionally NOT selected: scientific code uses single-letter
# names like D, c, ρ, V that would otherwise be flagged.
ignore = [
    # Homoglyph rules flag Greek letters (ρ, Γ, ∇, λ, …) as ambiguous Latin
    # look-alikes. They exist to catch homoglyph attacks in identifiers; in
    # scientific docstrings/comments the Greek symbols are intentional and
    # match the math in the literature. Disable across the board.
    "RUF001",  # ambiguous unicode in identifier
    "RUF002",  # ambiguous unicode in docstring
    "RUF003",  # ambiguous unicode in comment
]

[tool.ruff.lint.per-file-ignores]
# Tests can shadow fixtures with the same name as parameters; common pytest pattern.
"tests/**/*.py" = ["B018"]

# ---------------------------------------------------------------------------
# mypy — strict mode. Applies to src/ and tests/ alike.
#
# The FEniCSx scientific stack ships either no stubs or partial/buggy ones
# (e.g. petsc4py.PETSc.ScalarType typed as a non-callable dtype, pyvista
# Plotter methods missing `self`). We treat these libraries as opaque
# (follow_imports = "skip") so their boundaries become Any, and we type our
# own code strictly. We do NOT add a global ignore_missing_imports — that
# would mask real typos in our own modules.
# ---------------------------------------------------------------------------

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
# Strict already enables warn_unused_ignores; keep it explicit so anyone
# reading the config sees that `# type: ignore` comments must be load-bearing.
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "dolfinx.*",
    "ufl.*",
    "basix.*",
    "petsc4py.*",
    "mpi4py.*",
    "gmsh",
    "pyvista",
    "pyvista.*",
    "scifem.*",
    "dolfinx_mpc.*",
    "meshio",
    "scipy.*",
]
ignore_missing_imports = true
follow_imports = "skip"
