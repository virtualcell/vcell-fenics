name: moving_bulk_expansion_diffusion
description: >
  Steady lab-frame u* = 2 + sin(x)·cos(y) held on a RADIALLY EXPANDING disk (v = [k·x, k·y], ∇·v = 2k,
  k = 0.25). For a lab-steady u* the ALE conservation-form source is f = ∇·(u* v) − D∇²u*, so u* is the
  exact solution and the solver must hold it to O(h²) as the disk deforms. Exercises the moving-mesh
  advection + dilution + source consistency together. Dirichlet u* on the moving boundary (the runner
  refreshes it at the moved configuration each step). NOTE: this case currently exposes a defect — the
  error does not converge in h and grows with deformation; see mms/README.md.
harness: bulk
dim: 2
geometry: {kind: disk, radius: 1.0, volume_subdomain: cyto, boundary: edge}
exact: {c: "2 + np.sin(x)*np.cos(y)"}
t_final: 1.0
dt: 0.01
resolutions_h: [0.1, 0.05, 0.025]
expected_order_h: 2.0
applicable_solvers: [fenics-be, fenics-mol, mbsolver]
params: {k: 0.25, D: 0.1}
math: |
  math_description:
    geometry: disk
    subdomains:
      - { name: cyto, kind: volume, motion: { kind: prescribed, velocity: "[0.25*geom.x[0], 0.25*geom.x[1]]" } }
    variables:
      - { name: c, subdomain: cyto }
    equations:
      - template: bulk_radv_diff
        variable: c
        subdomain: cyto
        temporality: time_dependent
        terms:
          diffusion: "0.1"
          source: "0.25*geom.x[0]*cos(geom.x[0])*cos(geom.x[1]) - 0.25*geom.x[1]*sin(geom.x[0])*sin(geom.x[1]) + 1.0 + 0.7*sin(geom.x[0])*cos(geom.x[1])"
        initial_condition: "2 + sin(geom.x[0])*cos(geom.x[1])"
    boundary_conditions:
      - { kind: dirichlet, variable: c, boundary: edge, expression: "2 + sin(geom.x[0])*cos(geom.x[1])" }
