name: bulk_anisotropic_stretch_diffusion
description: >
  Steady lab-frame u* = 2 + sin(x)·cos(y) held on an ANISOTROPICALLY STRETCHING disk (v = [0.3·x, −0.1·y],
  ∇·v = 0.2). For a lab-steady u* the ALE conservation-form source is f = ∇·(u* v) − D∇²u* =
  v·∇u* + u*∇·v − D∇²u*, so u* is the exact solution and the solver must hold it to O(h²) as the disk
  deforms. Exercises moving-mesh anisotropic advection + non-zero dilution + source consistency together.
  Dirichlet u* on the moving boundary (the runner refreshes it at the moved configuration each step).
harness: bulk
dim: 2
geometry: {kind: disk, radius: 1.0, volume_subdomain: cyto, boundary: edge}
exact: {c: "2 + np.sin(x)*np.cos(y)"}
t_final: 1.0
dt: 0.01
resolutions_h: [0.1, 0.07, 0.05]
expected_order_h: 2.0
applicable_solvers: [fenics-be, fenics-mol]
params: {ax: 0.3, ay: -0.1, D: 0.1}
math: |
  math_description:
    geometry: disk
    subdomains:
      - { name: cyto, kind: volume, motion: { kind: prescribed, velocity: "[0.3*geom.x[0], -0.1*geom.x[1]]" } }
    variables:
      - { name: c, subdomain: cyto }
    equations:
      - template: bulk_radv_diff
        variable: c
        subdomain: cyto
        temporality: time_dependent
        terms:
          diffusion: "0.1"
          source: "0.3*geom.x[0]*cos(geom.x[0])*cos(geom.x[1]) + 0.1*geom.x[1]*sin(geom.x[0])*sin(geom.x[1]) + 0.4 + 0.4*sin(geom.x[0])*cos(geom.x[1])"
        initial_condition: "2 + sin(geom.x[0])*cos(geom.x[1])"
    boundary_conditions:
      - { kind: dirichlet, variable: c, boundary: edge, expression: "2 + sin(geom.x[0])*cos(geom.x[1])" }
