name: bulk_expansion_timedependent_static
description: >
  Static twin of bulk_expansion_timedependent. Time-dependent manufactured solution
  u* = exp(-t)·(2 + sin(x)·cos(y)) on a FIXED disk (motion off), held by the source
  f = ∂_t u* − D∇²u* = exp(-t)·(−2 − 0.8·sin(x)cos(y)) with a time-dependent Dirichlet u*
  on the boundary (refreshed each step via sim.t). Validates the forcing derivation before the
  moving case is trusted. Small dt (0.005) keeps the O(dt) backward-Euler time error below the
  O(h²) spatial floor so the backward-Euler h-order reads ≈ 2. If this does not converge, the forcing
  or the runner is wrong — not the solver. The MOL/TS (fenics-mol) path also runs (a time-error-free
  cross-check), needing both `mol_rtol: 1e-9` and `mol_dt_initial: 1e-6` to clear the two adaptive-BDF
  temporal floors; on this plain (independently-remeshed, curved) disk its spatial order reads ~1.6 — the
  P1 curved-domain rate, NOT the backward-Euler-tuned 2.0 — so it clears the 0.5-slack gate threshold but is
  not a clean O(h²). This is the same plain-disk convention as the sibling bulk_expansion_timedependent /
  bulk_expansion_pure_diffusion_check / bulk_advection_static_mesh cases (the expansion family predates the
  box/disk doubling and stays on the plain `disk`).
harness: bulk
dim: 2
geometry: {kind: disk, radius: 1.0, volume_subdomain: cyto, boundary: edge}
exact: {c: "np.exp(-t)*(2 + np.sin(x)*np.cos(y))"}
t_final: 1.0
dt: 0.005
resolutions_h: [0.1, 0.05, 0.025]
expected_order_h: 2.0
mol_rtol: 1.0e-9    # controlled-time-error floor (see description)
mol_dt_initial: 1.0e-6  # BDF cold-start floor = t_final/1e6 (see description); MOL order ~1.6 (plain-disk P1 cap)
applicable_solvers: [fenics-be, fenics-mol]
params: {D: 0.1}
math: |
  math_description:
    geometry: disk
    subdomains:
      - { name: cyto, kind: volume }
    variables:
      - { name: c, subdomain: cyto }
    equations:
      - template: bulk_radv_diff
        variable: c
        subdomain: cyto
        temporality: time_dependent
        terms:
          diffusion: "0.1"
          source: "exp(-sim.t)*(-2 - 0.8*sin(geom.x[0])*cos(geom.x[1]))"
        initial_condition: "2 + sin(geom.x[0])*cos(geom.x[1])"
    boundary_conditions:
      - { kind: dirichlet, variable: c, boundary: edge, expression: "exp(-sim.t)*(2 + sin(geom.x[0])*cos(geom.x[1]))" }
