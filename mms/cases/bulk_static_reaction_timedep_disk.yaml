name: bulk_static_reaction_timedep_disk
description: >
  Static-mesh validator for the reaction + time-dependence terms. A TIME-DEPENDENT manufactured solution
  u* = exp(-t)·(2 + sin(x)·cos(y)) on a FIXED disk (no motion), diffusion D = 0.1, held by the source
  f = ∂_t u* − D∇²u* = −u* + 2D·exp(-t)·sin(x)cos(y) = −2·exp(-t) − 0.8·exp(-t)·sin(x)cos(y), with the
  time-dependent Dirichlet u* on the boundary (refreshed via set_time each step). No motion, so this exercises
  the time-derivative + diffusion + (time-dependent) source consistency for both the backward-Euler (fenics-be)
  and MOL/TS (fenics-mol) integrators. NOTE: the manufactured forcing is verified correct (the error is exactly
  O(dt) and → 0 as dt → 0). The backward-Euler path holds its expected order (≥1.5 at the P1 curved-domain
  rate). The MOL (adaptive-BDF) path exposes TWO independent temporal-error floors that must BOTH be pushed
  below the spatial error to read the spatial order — this disk case (unlike the `_box` twin) hits both:
    (1) the CONTROLLED time error — the adaptive relative tolerance; default 1e-6 is too loose at fine h, so it
        carries `mol_rtol: 1e-9`; and
    (2) the BDF COLD-START — the first step runs at order 1 (backward Euler) and the adaptive controller cannot
        see that step's truncation error, leaving an rtol-INDEPENDENT bias ≈ the startup step. The integrator's
        default startup t_final/1e4 is small enough on the box but not on the finer curved disk, so it carries
        `mol_dt_initial: 1e-6` (= t_final/1e6). This is NOT curved-boundary spatial error — the decaying + STATIC-
        Dirichlet variant on the same disk converges cleanly, and BE holds order 2 on this exact mesh.
  Measured MOL order with BOTH knobs ≈ 1.7 (the P1 curved-domain rate). The `_box` twin needs only `mol_rtol`.
harness: bulk
dim: 2
geometry: {kind: nested_disk, radius: 1.0, base_h: 0.1, volume_subdomain: cyto, boundary: edge}
exact: {c: "np.exp(-t)*(2 + np.sin(x)*np.cos(y))"}
t_final: 1.0
dt: 0.005
resolutions_h: [0.1, 0.05, 0.025]
expected_order_h: 1.5
mol_rtol: 1.0e-9    # controlled-time-error floor (see description)
mol_dt_initial: 1.0e-6  # BDF cold-start floor = t_final/1e6, rtol-independent (see description)
applicable_solvers: [fenics-be, fenics-mol]
params: {D: 0.1}
math: |
  math_description:
    geometry: disk
    subdomains:
      - { name: cyto, kind: volume }
    variables:
      - { name: c, subdomain: cyto }
    equations:
      - template: bulk_radv_diff
        variable: c
        subdomain: cyto
        temporality: time_dependent
        terms:
          diffusion: "0.1"
          source: "-2*exp(-sim.t) - 0.8*exp(-sim.t)*sin(geom.x[0])*cos(geom.x[1])"
        initial_condition: "2 + sin(geom.x[0])*cos(geom.x[1])"
    boundary_conditions:
      - { kind: dirichlet, variable: c, boundary: edge, expression: "exp(-sim.t)*(2 + sin(geom.x[0])*cos(geom.x[1]))" }
