name: bulk_advection_static_mesh
description: >
  Steady manufactured solution u* = 2 + sin(x)·cos(y) on a FIXED disk with diffusion (D = 0.1) plus an
  Eulerian drift w_rel = [0.5, 0] carried in the template's relative_advection slot (no mesh motion). On a
  static mesh the strong form is w_rel·∇u* = D∇²u* + f, so the manufactured source is
  f = w_rel·∇u* − D∇²u* = 0.5·cos(x)cos(y) − D·(−2 sin(x)cos(y)) = 0.5·cos(x)cos(y) + 0.2·sin(x)cos(y),
  with Dirichlet u* on the boundary. Exercises the advection-term consistency on a fixed mesh for both the
  backward-Euler and MOL solvers; must hold u* to O(h²).
harness: bulk
dim: 2
geometry: {kind: disk, radius: 1.0, volume_subdomain: cyto, boundary: edge}
exact: {c: "2 + np.sin(x)*np.cos(y)"}
t_final: 1.0
dt: 0.05
resolutions_h: [0.1, 0.05, 0.025]
expected_order_h: 2.0
applicable_solvers: [fenics-be, fenics-mol]
params: {w: 0.5, D: 0.1}
math: |
  math_description:
    geometry: disk
    subdomains:
      - { name: cyto, kind: volume }
    variables:
      - { name: c, subdomain: cyto }
    equations:
      - template: bulk_radv_diff
        variable: c
        subdomain: cyto
        temporality: time_dependent
        terms:
          diffusion: "0.1"
          relative_advection: "[0.5, 0.0]"
          source: "0.5*cos(geom.x[0])*cos(geom.x[1]) + 0.2*sin(geom.x[0])*cos(geom.x[1])"
        initial_condition: "2 + sin(geom.x[0])*cos(geom.x[1])"
    boundary_conditions:
      - { kind: dirichlet, variable: c, boundary: edge, expression: "2 + sin(geom.x[0])*cos(geom.x[1])" }
