name: bulk_expansion_pure_diffusion_check_static_disk
description: >
  Static twin of bulk_expansion_pure_diffusion_check_disk. Steady u* = 2 + sin(x)·cos(y) on a FIXED nested
  disk with pure diffusion D = 0.1, held by the source f = −D∇²u* = 0.2·sin(x)cos(y) and Dirichlet u* on the
  boundary. Motion OFF. Validates the manufactured forcing / u* derivation independently of any moving-mesh
  machinery. This is the curvature-preserving NESTED disk (P1-capped at the curved-domain rate ~O(h^1.5)). A
  STEADY solution on a FIXED mesh: the initial condition already equals u*, so the method-of-lines integrator
  would start on the answer and measure nothing — fenics-mol is omitted (it is a no-op here); the
  backward-Euler check suffices. Box twin: bulk_expansion_pure_diffusion_check_static_box.
harness: bulk
dim: 2
geometry: {kind: nested_disk, radius: 1.0, base_h: 0.1, volume_subdomain: cyto, boundary: edge}
exact: {c: "2 + np.sin(x)*np.cos(y)"}
t_final: 1.0
dt: 0.05
resolutions_h: [0.1, 0.05, 0.025]
expected_order_h: 1.5
applicable_solvers: [fenics-be]
params: {D: 0.1}
math: |
  math_description:
    geometry: disk
    subdomains:
      - { name: cyto, kind: volume }
    variables:
      - { name: c, subdomain: cyto }
    equations:
      - template: bulk_radv_diff
        variable: c
        subdomain: cyto
        temporality: time_dependent
        terms:
          diffusion: "0.1"
          source: "0.2*sin(geom.x[0])*cos(geom.x[1])"
        initial_condition: "2 + sin(geom.x[0])*cos(geom.x[1])"
    boundary_conditions:
      - { kind: dirichlet, variable: c, boundary: edge, expression: "2 + sin(geom.x[0])*cos(geom.x[1])" }
