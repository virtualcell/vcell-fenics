name: bulk_expansion_timedependent_static_box
description: >
  Static twin of bulk_expansion_timedependent_box. Time-dependent manufactured solution
  u* = exp(-t)·(2 + sin(x)·cos(y)) on a FIXED box (motion off), held by the source
  f = ∂_t u* − D∇²u* = exp(-t)·(−2 − 0.8·sin(x)cos(y)) with a time-dependent Dirichlet u*
  on the boundary (refreshed each step via sim.t). Validates the forcing derivation before the
  moving case is trusted. On this STRAIGHT-boundary structured box the P1 spatial order is a clean O(h²);
  small dt (0.005) keeps the O(dt) backward-Euler time error below it so the BE h-order reads ≈ 2. The MOL/TS
  path is a time-error-free cross-check; being a DECAYING solution it needs `mol_rtol: 1e-9` to hold the
  adaptive-BDF controlled time error below O(h²) (MOL order ≈ 1.9). Disk twin:
  bulk_expansion_timedependent_static_disk.
harness: bulk
dim: 2
geometry: {kind: structured_box, extent: [2.0, 2.0], origin: [-1.0, -1.0], volume_subdomain: cyto, boundary: edge}
exact: {c: "np.exp(-t)*(2 + np.sin(x)*np.cos(y))"}
t_final: 1.0
dt: 0.005
resolutions_h: [0.1, 0.05, 0.025]
expected_order_h: 2.0
mol_rtol: 1.0e-9    # controlled-time-error floor for the decaying solution (see description)
applicable_solvers: [fenics-be, fenics-mol]
params: {D: 0.1}
math: |
  math_description:
    geometry: box
    subdomains:
      - { name: cyto, kind: volume }
    variables:
      - { name: c, subdomain: cyto }
    equations:
      - template: bulk_radv_diff
        variable: c
        subdomain: cyto
        temporality: time_dependent
        terms:
          diffusion: "0.1"
          source: "exp(-sim.t)*(-2 - 0.8*sin(geom.x[0])*cos(geom.x[1]))"
        initial_condition: "2 + sin(geom.x[0])*cos(geom.x[1])"
    boundary_conditions:
      - { kind: dirichlet, variable: c, boundary: edge, expression: "exp(-sim.t)*(2 + sin(geom.x[0])*cos(geom.x[1]))" }
