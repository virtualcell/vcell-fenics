name: bulk_anisotropic_stretch_diffusion_static_box
description: >
  Static twin of bulk_anisotropic_stretch_diffusion. Steady manufactured solution u* = 2 + sin(x)·cos(y)
  on a FIXED box (motion off), held by the source f = −D∇²u* = 0.2·sin(x)cos(y) with Dirichlet u* on the
  boundary. Validates the forcing derivation before adding motion: must converge at order ≈ 2.
harness: bulk
dim: 2
geometry: {kind: structured_box, extent: [2.0, 2.0], origin: [-1.0, -1.0], volume_subdomain: cyto, boundary: edge}
exact: {c: "2 + np.sin(x)*np.cos(y)"}
t_final: 1.0
dt: 0.05
resolutions_h: [0.1, 0.05, 0.025]
expected_order_h: 2.0
applicable_solvers: [fenics-be]
params: {D: 0.1}
math: |
  math_description:
    geometry: box
    subdomains:
      - { name: cyto, kind: volume }
    variables:
      - { name: c, subdomain: cyto }
    equations:
      - template: bulk_radv_diff
        variable: c
        subdomain: cyto
        temporality: time_dependent
        terms:
          diffusion: "0.1"
          source: "0.2*sin(geom.x[0])*cos(geom.x[1])"
        initial_condition: "2 + sin(geom.x[0])*cos(geom.x[1])"
    boundary_conditions:
      - { kind: dirichlet, variable: c, boundary: edge, expression: "2 + sin(geom.x[0])*cos(geom.x[1])" }
