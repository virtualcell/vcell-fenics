# The vcell-fenics solver image: build it, prove it runs the VCell path (Docker and Apptainer), and — on
# main and release tags only — publish it the way VCell's cluster consumes solver images
# (../vcell/docs/apptainer-image-build.md):
#
#   ghcr.io/virtualcell/vcell-fenics:<tag>                      multi-arch Docker image (desktop runs)
#   oras://ghcr.io/virtualcell/vcell-fenics_singularity:<tag>   Apptainer SIF (Slurm; pre-pulled by FluxCD)
#
# A release is a tag vX.Y.Z on main (SOLVER-RELEASE.md). It must equal the package version
# (`vcell_fenics.__version__` and pyproject's [project].version) — the setup job fails the whole run
# otherwise, and each image job checks the built image reports it — and publishes, besides the
# commit's sha-<short>, the image and SIF tags X.Y.Z and vX.Y.Z, then a GitHub Release with notes.
# `latest` follows main, not tags.
#
# Pull requests build and smoke-test only; nothing is pushed. arm64 is opt-in: set the repository
# variable ARM64_RUNNER (e.g. `ubuntu-24.04-arm`) when the organization's plan provides hosted arm64
# runners for this private repository — a matrix entry naming an unavailable runner would queue forever.
name: container

on:
  pull_request:
    paths:
      - docker/**
      - .dockerignore
      - pixi.lock
      - pyproject.toml
      - src/**
      - tests/fixtures/simtask/**
      - .github/workflows/container.yml
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/virtualcell/vcell-fenics
  SIF: ghcr.io/virtualcell/vcell-fenics_singularity
  SIMTASK: /opt/vcell-fenics/examples/simtask/SimID_1585623750_0__0.simtask.xml
  BUNDLE: SimID_1585623750_0_.fenics
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  # docker/metadata-action tag rules, shared by the per-arch push (SIF tags) and the manifest job.
  # A tag build is the same commit main already published as sha-<short>; re-tagging that sha with
  # a rebuilt digest would leave one sha tag naming two images, so tag builds skip it.
  TAG_RULES: |
    type=semver,pattern={{version}}
    type=ref,event=tag
    type=sha,format=short,enable=${{ github.ref_type != 'tag' }}
    type=raw,value=latest,enable={{is_default_branch}}

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One version, three places: pyproject, the package, and (on a release) the tag — all must agree.
      - id: version
        run: |
          set -euo pipefail
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          package=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/vcell_fenics/__init__.py)
          echo "pyproject: ${project}  vcell_fenics.__version__: ${package}"
          if [ "${project}" != "${package}" ]; then
            echo "::error::pyproject.toml version ${project} != vcell_fenics.__version__ ${package}"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${package}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the package version ${package} (expected v${package}); bump the version in a PR first"; exit 1
            fi
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::tag ${GITHUB_REF_NAME} is not on main; releases are cut from main"; exit 1
            fi
          fi
          echo "version=${package}" >> "$GITHUB_OUTPUT"

      - id: matrix
        env:
          ARM64_RUNNER: ${{ vars.ARM64_RUNNER }}
        run: |
          amd64='{"platform":"linux/amd64","runner":"ubuntu-24.04","arch":"amd64"}'
          if [ -n "${ARM64_RUNNER}" ]; then
            echo "matrix=[${amd64},{\"platform\":\"linux/arm64\",\"runner\":\"${ARM64_RUNNER}\",\"arch\":\"arm64\"}]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[${amd64}]" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: image (${{ matrix.arch }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is ~3 GB and the SIF built from it ~1 GB; the hosted runner's free disk is tight.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: docker/setup-buildx-action@v3

      - name: Build and load
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: vcell-fenics:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: The image reports the package version
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euxo pipefail
          test "$(docker run --rm vcell-fenics:ci --version)" = "vcell-fenics ${VERSION}"
          test "$(docker run --rm vcell-fenics:ci python -c 'import vcell_fenics; print(vcell_fenics.__version__)')" = "${VERSION}"
          test "$(docker run --rm vcell-fenics:ci python -c 'from importlib.metadata import version; print(version("vcell-fenics"))')" = "${VERSION}"
          docker run --rm vcell-fenics:ci | grep -q "vcell-fenics ${VERSION}"   # no argument: help, with the version

      # The build itself already ran the SimulationTask warm-up; these repeat it the way VCell's
      # desktop client will launch the image (same-path bind mount, the caller's uid).
      - name: Smoke — a VCell SimulationTask with stdout status markers
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/serial"; mkdir -p "$work"
          docker run --rm --user "$(id -u):$(id -g)" -v "$work:$work" vcell-fenics:ci \
            vcell-fenics --simtask "$SIMTASK" --out "$work" --vc-print-status > "$work/markers.txt"
          cat "$work/markers.txt"
          grep -q '\[\[\[progress:100.0%\]\]\]' "$work/markers.txt"
          if grep -v '^\[\[\[.*\]\]\]$' "$work/markers.txt"; then   # stdout must carry markers only
            echo "::error::non-marker output on stdout (VCell's scanner would break on it)"; exit 1
          fi
          docker run --rm -v "$work:$work" vcell-fenics:ci \
            python -m vcell_fenics.results "$work/$BUNDLE" --require-status completed

      - name: Smoke — MPI (2 ranks) reproduces the serial bundle
        run: |
          set -euxo pipefail
          serial="$RUNNER_TEMP/serial"; mpi="$RUNNER_TEMP/mpi"; mkdir -p "$mpi"
          docker run --rm --shm-size=1g --user "$(id -u):$(id -g)" -v "$mpi:$mpi" vcell-fenics:ci \
            mpiexec -n 2 vcell-fenics --simtask "$SIMTASK" --out "$mpi"
          docker run --rm -i -v "$serial:$serial" -v "$mpi:$mpi" vcell-fenics:ci \
            python - "$serial/$BUNDLE" "$mpi/$BUNDLE" <<'PY'
          import sys
          import numpy as np
          from vcell_fenics.results import Bundle
          serial, mpi = (Bundle.open(p) for p in sys.argv[1:3])
          assert mpi.manifest.solver.mpi_ranks == 2 and mpi.times == serial.times
          for v in serial.manifest.variables:
              a, b = serial.mesh(v.domain), mpi.mesh(v.domain)
              assert np.array_equal(a.points, b.points) and np.array_equal(a.cells, b.cells), v
              assert np.allclose(serial.series(v.domain, v.name), mpi.series(v.domain, v.name), rtol=1e-4, atol=1e-10), v
          print("MPI bundle matches serial:", [v.name for v in serial.manifest.variables])
          PY

      # Apptainer runs the image read-only under --containall — the cluster's conditions. The P2 run
      # compiles forms the image never pre-warmed, which only works if the entry point moved the
      # FFCx cache somewhere writable.
      - name: Install Apptainer
        if: matrix.arch == 'amd64'
        uses: eWaterCycle/setup-apptainer@v2

      - name: Smoke — the SIF under --containall
        if: matrix.arch == 'amd64'
        run: |
          set -euxo pipefail
          apptainer build "$RUNNER_TEMP/vcell-fenics.sif" docker-daemon://vcell-fenics:ci
          apptainer inspect "$RUNNER_TEMP/vcell-fenics.sif" > /dev/null
          work="$RUNNER_TEMP/sif"; mkdir -p "$work"
          apptainer run --containall --bind "$work:$work" "$RUNNER_TEMP/vcell-fenics.sif" \
            vcell-fenics --simtask "$SIMTASK" --out "$work" --vc-print-status > "$work/markers.txt"
          grep -q '\[\[\[progress:100.0%\]\]\]' "$work/markers.txt"
          apptainer run --containall --bind "$work:$work" "$RUNNER_TEMP/vcell-fenics.sif" \
            vcell-fenics --math /opt/vcell-fenics/examples/diffusion2d_math.yaml \
              --geometry /opt/vcell-fenics/examples/diffusion2d_geom.yaml \
              --t-final 0.1 --dt 0.05 --h 0.4 --fe-degree 2 --out "$work/p2"
          apptainer run --containall --bind "$work:$work" "$RUNNER_TEMP/vcell-fenics.sif" \
            python -m vcell_fenics.results "$work/$BUNDLE" --require-status completed

      # Exactly SlurmProxy's shape: /simdata and the job's scratch bound at /solvertmp, TMPDIR pointed
      # there, a bare executable name, container paths, a trailing -tid. The JIT cache must land in the
      # scratch bind (real disk), not in --containall's small in-memory /tmp.
      - name: Smoke — the SIF as VCell's Slurm job runs it (TMPDIR=/solvertmp)
        if: matrix.arch == 'amd64'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euxo pipefail
          sif="$RUNNER_TEMP/vcell-fenics.sif"
          apptainer run --containall "$sif" --help | grep -q "vcell-fenics ${VERSION}"
          test "$(apptainer run --containall "$sif" --version)" = "vcell-fenics ${VERSION}"
          simdata="$RUNNER_TEMP/simdata"; scratch="$RUNNER_TEMP/solvertmp"; mkdir -p "$simdata/user" "$scratch"
          cp "tests/fixtures/simtask/$(basename "$SIMTASK")" "$simdata/user/"
          apptainer run --containall --bind "$simdata:/simdata" --bind "$scratch:/solvertmp" \
            --env TMPDIR=/solvertmp "$sif" \
            vcell-fenics --simtask "/simdata/user/$(basename "$SIMTASK")" --out /simdata/user \
              --fe-degree 2 --vc-print-status -tid 0 > "$simdata/markers.txt"
          grep -q '\[\[\[progress:100.0%\]\]\]' "$simdata/markers.txt"
          cache="$scratch/vcell-fenics-cache-$(id -u)/fenics"
          test -d "$cache"
          echo "JIT cache in the scratch bind: $(du -sh "$cache" | cut -f1), $(find "$cache" -type f | wc -l) files"
          apptainer run --containall --bind "$simdata:/simdata" "$sif" \
            python -m vcell_fenics.results "/simdata/user/$BUNDLE" --require-status completed

      # --- publishing (main and release tags only) -------------------------------------------------
      - name: Tags
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.TAG_RULES }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Record the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish the SIF (oras)
        if: env.PUBLISH == 'true' && matrix.arch == 'amd64'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          apptainer registry login --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" oras://ghcr.io
          for ref in $TAGS; do
            apptainer push "$RUNNER_TEMP/vcell-fenics.sif" "oras://${SIF}:${ref##*:}"
          done

  manifest:
    name: multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.TAG_RULES }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euxo pipefail
          # shellcheck disable=SC2046  # word splitting is the point: one -t per tag, one ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [setup, manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create (or update) the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          vcell-fenics ${VERSION}. The artifacts are container images (there are no archive assets: the solver
          runs only in its container, see SOLVER-RELEASE.md):

          | | |
          |---|---|
          | Docker image (multi-arch) | \`ghcr.io/virtualcell/vcell-fenics:${VERSION}\` (also \`:v${VERSION}\`) |
          | Apptainer SIF (amd64) | \`oras://ghcr.io/virtualcell/vcell-fenics_singularity:${VERSION}\` (also \`:v${VERSION}\`) |

          Built from ${GITHUB_SHA}.
          EOF
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "vcell-fenics ${VERSION}" --notes-file notes.md --generate-notes --verify-tag
          fi
