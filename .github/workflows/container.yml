# The vcell-fenics solver image: build it, prove it runs the VCell path (Docker and Apptainer), and — on
# main and release tags only — publish it the way VCell's cluster consumes solver images
# (../vcell/docs/apptainer-image-build.md):
#
#   ghcr.io/virtualcell/vcell-fenics:<tag>                      multi-arch Docker image (desktop runs)
#   oras://ghcr.io/virtualcell/vcell-fenics_singularity:<tag>   Apptainer SIF (Slurm; pre-pulled by FluxCD)
#
# Pull requests build and smoke-test only; nothing is pushed. arm64 is opt-in: set the repository
# variable ARM64_RUNNER (e.g. `ubuntu-24.04-arm`) when the organization's plan provides hosted arm64
# runners for this private repository — a matrix entry naming an unavailable runner would queue forever.
name: container

on:
  pull_request:
    paths:
      - docker/**
      - .dockerignore
      - pixi.lock
      - pyproject.toml
      - src/**
      - tests/fixtures/simtask/**
      - .github/workflows/container.yml
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/virtualcell/vcell-fenics
  SIF: ghcr.io/virtualcell/vcell-fenics_singularity
  SIMTASK: /opt/vcell-fenics/examples/simtask/SimID_1585623750_0__0.simtask.xml
  BUNDLE: SimID_1585623750_0_.fenics
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          ARM64_RUNNER: ${{ vars.ARM64_RUNNER }}
        run: |
          amd64='{"platform":"linux/amd64","runner":"ubuntu-24.04","arch":"amd64"}'
          if [ -n "${ARM64_RUNNER}" ]; then
            echo "matrix=[${amd64},{\"platform\":\"linux/arm64\",\"runner\":\"${ARM64_RUNNER}\",\"arch\":\"arm64\"}]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[${amd64}]" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: image (${{ matrix.arch }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image is ~3 GB and the SIF built from it ~1 GB; the hosted runner's free disk is tight.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: docker/setup-buildx-action@v3

      - name: Build and load
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: vcell-fenics:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # The build itself already ran the SimulationTask warm-up; these repeat it the way VCell's
      # desktop client will launch the image (same-path bind mount, the caller's uid).
      - name: Smoke — a VCell SimulationTask with stdout status markers
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/serial"; mkdir -p "$work"
          docker run --rm --user "$(id -u):$(id -g)" -v "$work:$work" vcell-fenics:ci \
            vcell-fenics --simtask "$SIMTASK" --out "$work" --vc-print-status > "$work/markers.txt"
          cat "$work/markers.txt"
          grep -q '\[\[\[progress:100.0%\]\]\]' "$work/markers.txt"
          if grep -v '^\[\[\[.*\]\]\]$' "$work/markers.txt"; then   # stdout must carry markers only
            echo "::error::non-marker output on stdout (VCell's scanner would break on it)"; exit 1
          fi
          docker run --rm -v "$work:$work" vcell-fenics:ci \
            python -m vcell_fenics.results "$work/$BUNDLE" --require-status completed

      - name: Smoke — MPI (2 ranks) reproduces the serial bundle
        run: |
          set -euxo pipefail
          serial="$RUNNER_TEMP/serial"; mpi="$RUNNER_TEMP/mpi"; mkdir -p "$mpi"
          docker run --rm --shm-size=1g --user "$(id -u):$(id -g)" -v "$mpi:$mpi" vcell-fenics:ci \
            mpiexec -n 2 vcell-fenics --simtask "$SIMTASK" --out "$mpi"
          docker run --rm -i -v "$serial:$serial" -v "$mpi:$mpi" vcell-fenics:ci \
            python - "$serial/$BUNDLE" "$mpi/$BUNDLE" <<'PY'
          import sys
          import numpy as np
          from vcell_fenics.results import Bundle
          serial, mpi = (Bundle.open(p) for p in sys.argv[1:3])
          assert mpi.manifest.solver.mpi_ranks == 2 and mpi.times == serial.times
          for v in serial.manifest.variables:
              a, b = serial.mesh(v.domain), mpi.mesh(v.domain)
              assert np.array_equal(a.points, b.points) and np.array_equal(a.cells, b.cells), v
              assert np.allclose(serial.series(v.domain, v.name), mpi.series(v.domain, v.name), rtol=1e-4, atol=1e-10), v
          print("MPI bundle matches serial:", [v.name for v in serial.manifest.variables])
          PY

      # Apptainer runs the image read-only under --containall — the cluster's conditions. The P2 run
      # compiles forms the image never pre-warmed, which only works if the entry point moved the
      # FFCx cache somewhere writable.
      - name: Install Apptainer
        if: matrix.arch == 'amd64'
        uses: eWaterCycle/setup-apptainer@v2

      - name: Smoke — the SIF under --containall
        if: matrix.arch == 'amd64'
        run: |
          set -euxo pipefail
          apptainer build "$RUNNER_TEMP/vcell-fenics.sif" docker-daemon://vcell-fenics:ci
          apptainer inspect "$RUNNER_TEMP/vcell-fenics.sif" > /dev/null
          work="$RUNNER_TEMP/sif"; mkdir -p "$work"
          apptainer run --containall --bind "$work:$work" "$RUNNER_TEMP/vcell-fenics.sif" \
            vcell-fenics --simtask "$SIMTASK" --out "$work" --vc-print-status > "$work/markers.txt"
          grep -q '\[\[\[progress:100.0%\]\]\]' "$work/markers.txt"
          apptainer run --containall --bind "$work:$work" "$RUNNER_TEMP/vcell-fenics.sif" \
            vcell-fenics --math /opt/vcell-fenics/examples/diffusion2d_math.yaml \
              --geometry /opt/vcell-fenics/examples/diffusion2d_geom.yaml \
              --t-final 0.1 --dt 0.05 --h 0.4 --fe-degree 2 --out "$work/p2"
          apptainer run --containall --bind "$work:$work" "$RUNNER_TEMP/vcell-fenics.sif" \
            python -m vcell_fenics.results "$work/$BUNDLE" --require-status completed

      # --- publishing (main and release tags only) -------------------------------------------------
      - name: Tags
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Record the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish the SIF (oras)
        if: env.PUBLISH == 'true' && matrix.arch == 'amd64'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euxo pipefail
          apptainer registry login --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" oras://ghcr.io
          for ref in $TAGS; do
            apptainer push "$RUNNER_TEMP/vcell-fenics.sif" "oras://${SIF}:${ref##*:}"
          done

  manifest:
    name: multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euxo pipefail
          # shellcheck disable=SC2046  # word splitting is the point: one -t per tag, one ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
