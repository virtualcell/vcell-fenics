- name: pproc_0.positionY
  exp: sin((1.5 * t))
- name: Size_cell
  exp: (VolumePerUnitVolume_cell * vcRegionVolume('cell'))
  domain: cell
- name: Size_extra
  exp: (VolumePerUnitVolume_extra * vcRegionVolume('extr'))
  domain: extr
- name: Size_mem
  exp: (AreaPerUnitArea_mem * vcRegionArea('cell_extr_membrane'))
  domain: cell_extr_membrane
- name: sobj_cell1_extr0_normalX
  exp: normalX()
  domain: cell_extr_membrane
- name: sobj_cell1_extr0_normalY
  exp: normalY()
  domain: cell_extr_membrane
- name: sobj_cell1_extr0_size
  exp: vcRegionArea('cell_extr_membrane')
  domain: cell_extr_membrane
- name: sobj_cell1_extr0_velX
  exp: sproc_0.velocityX
  domain: cell_extr_membrane
- name: sobj_cell1_extr0_velY
  exp: sproc_0.velocityY
  domain: cell_extr_membrane
- name: sproc_0.velocityX
  exp: ((a - 1.0) * abs((a - 1.0)) * sobj_cell1_extr0_normalX)
  domain: cell_extr_membrane
- name: sproc_0.velocityY
  exp: ((a - 1.0) * abs((a - 1.0)) * sobj_cell1_extr0_normalY)
  domain: cell_extr_membrane
- name: vobj_cell1_size
