- name: pobj_0_directionX
  exp: ((pproc_0.positionX - x) / (sqrt((((pproc_0.positionX - x) * (pproc_0.positionX
    - x)) + ((pproc_0.positionY - y) * (pproc_0.positionY - y)))) + 1.0E-8))
- name: pobj_0_directionY
  exp: ((pproc_0.positionY - y) / (sqrt((((pproc_0.positionX - x) * (pproc_0.positionX
    - x)) + ((pproc_0.positionY - y) * (pproc_0.positionY - y)))) + 1.0E-8))
- name: pobj_0_distance
  exp: sqrt((((pproc_0.positionX - x) * (pproc_0.positionX - x)) + ((pproc_0.positionY
    - y) * (pproc_0.positionY - y))))
- name: pobj_0_posX
  exp: pproc_0.positionX
- name: pobj_0_posY
  exp: pproc_0.positionY
- name: pproc_0.positionX
